<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540">
  <defs>
    <linearGradient id="bg-operations" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefaf6"/>
      <stop offset="100%" stop-color="#fde8d7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="540" fill="url(#bg-operations)"/>

  <!-- Top Autumn Leaves Canopy -->
  <g opacity="0.92">
    <g transform="translate(55,34) rotate(-18)">
